services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: cutline
      POSTGRES_USER: cutline
      POSTGRES_PASSWORD: cutline-local
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutline -d cutline"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - cutline-postgres:/var/lib/postgresql/data

volumes:
  cutline-postgres:
