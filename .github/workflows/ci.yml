name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$unformatted" || {
            printf 'gofmt required for:\n%s\n' "$unformatted" >&2
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout=20m

      - name: Race test
        run: go test -race ./... -timeout=20m

      - name: Build
        run: go build -buildvcs=false -trimpath -o /tmp/cutline ./cmd/cutline

      - name: Package Linux release candidate
        run: make package VERSION=v0.0.0-ci OUT_DIR=/tmp/cutline-dist

      - name: Smoke test unpacked Linux release
        run: bash scripts/verify-package.sh /tmp/cutline-dist v0.0.0-ci

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v7
        with:
          name: cutline-linux-release-candidate
          path: /tmp/cutline-dist
          retention-days: 7

  integration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test PostgreSQL schema and runtime persistence
        run: go test -v -tags=integration ./internal/ledger ./internal/cli -count=1 -timeout=15m

  integration-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test live Temporal history ingestion
        run: bash test/temporal/run-integration.sh

      - name: Upload Temporal replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cutline-temporal-evidence
          path: artifacts/temporal*
          if-no-files-found: ignore
          retention-days: 7
