name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$unformatted" || {
            printf 'gofmt required for:\n%s\n' "$unformatted" >&2
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Build
        run: go build -trimpath -o /tmp/cutline ./cmd/cutline

      - name: Package Linux release candidate
        run: make package VERSION=v0.0.0-ci OUT_DIR=/tmp/cutline-dist

  integration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test PostgreSQL schema
        run: go test -tags=integration ./internal/ledger -run TestPostgresSchemaConstraintsAndFreeze -count=1 -timeout=5m

  integration-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test live Temporal history ingestion
        run: bash test/temporal/run-integration.sh
