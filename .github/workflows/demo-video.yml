name: Cloud demo video

on:
  push:
    branches:
      - codex/cloud-demo-recordings
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the reference scenarios
        shell: bash
        run: |
          go build -buildvcs=false -trimpath -o /tmp/cutline-demo ./cmd/cutline
          set +e
          /tmp/cutline-demo run --campaign test/fixtures/checkout/campaign-faulty.yaml > /tmp/cutline-faulty.log 2>&1
          faulty_status=$?
          set -e
          test "$faulty_status" -eq 2
          grep -q 'contract no-charge-after-cancel: violation' /tmp/cutline-faulty.log
          /tmp/cutline-demo run --campaign test/fixtures/checkout/campaign-clean.yaml > /tmp/cutline-clean.log 2>&1
          {
            echo "CUTLINE / CANCELLATION-SAFETY DEMO"
            echo
            echo "Cloud runner: GitHub Actions Ubuntu"
            echo "Faulty fixture exit code: $faulty_status (expected: 2, named contract violation)"
            echo
            echo "Faulty campaign:"
            tail -n 10 /tmp/cutline-faulty.log
            echo
            echo "Clean campaign:"
            tail -n 10 /tmp/cutline-clean.log
          } > /tmp/cutline-demo.txt
          grep -q 'campaign "checkout-clean": pass' /tmp/cutline-clean.log

      - name: Install video tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render the demo video
        run: |
          mkdir -p docs/demo
          ffmpeg -y -f lavfi -i color=c=0x111827:s=1600x1000:r=25 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf:textfile=/tmp/cutline-demo.txt:fontcolor=white:fontsize=18:line_spacing=6:x=40:y=40" \
            -t 12 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart docs/demo/cutline-demo.mp4
          ffmpeg -y -i docs/demo/cutline-demo.mp4 \
            -vf "fps=8,scale=900:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=sierra2" \
            docs/demo/cutline-demo.gif

      - name: Upload demo artifact
        uses: actions/upload-artifact@v7
        with:
          name: cutline-cloud-demo
          path: docs/demo
          retention-days: 7
