apiVersion: cutline.dev/v1alpha1
kind: Campaign
name: registered-descendant-drain-timeout

target:
  adapter: go-test
  command: [go, test, ./test/fixtures/sdkdrain, -run, ^TestCutlineTarget$, -count=1, -args, -cutline-drain-mode=stuck]

exploration:
  strategy: single-cut
  maxSchedules: 1
  maxPointVisits: 10
  scheduleTimeout: 30s
  drainTimeout: 100ms
  cancelAt: [root-return]
  seed: 1

contracts:
  - name: registered-tasks-drained
    version: 1
    severity: critical
    requires: [drain.registered_tasks]
    expression: '!tasks.exists(t, !t.isTerminalAt(run.drainedAt))'
